name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run astryx -- doctor
      - name: Verify multiplayer service
        working-directory: services/session-server
        run: npm ci && npm run typecheck && npm run build
      - name: Verify AWS infrastructure
        working-directory: infra
        run: npm ci && npm run build
